[tool.pylint.main]
max-line-length = 120

[tool.pylint.messages_control]
# Project lint policy for a FastAPI + SQLAlchemy codebase: silence conventions
# and framework false-positives, keep real correctness checks on.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-return-statements",
    "too-many-nested-blocks",
    "not-callable",
    "import-outside-toplevel",
    "broad-exception-caught",
    "unused-argument",
    "invalid-name",
    "duplicate-code",
    "redefined-builtin",
    "redefined-outer-name",
    "global-statement",
    "subprocess-run-check",
    "consider-using-with",
    "wrong-import-position",
    "wrong-import-order",
    "possibly-used-before-assignment",
]
